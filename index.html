<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board Calculator</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4caf50">

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
  padding-bottom:110px;
}

.panel { display:grid; gap:8px; margin-bottom:10px; }

input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
}

.hidden { display:none !important; }

button {
  width:100%;
  max-width:360px;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.15);
  background:#f5f5f5;
  margin-top:6px;
}

.btnRow { display:flex; flex-direction:column; gap:8px; }

.grid { margin-top:12px; }

.row { display:flex; gap:4px; }
.cell { flex:1; aspect-ratio:3/1; background:#8b5a2b; color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; }
.empty { flex:1; aspect-ratio:3/1; border:1px dashed #ccc; }
.reject { background:#f4a300 !important; }

#step5_rejects {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:10px;
  border-top:1px solid #ccc;
}
</style>
</head>

<body>

<div id="headerBar" style="display:flex; justify-content:space-between; margin-bottom:12px;">
  <h3>Pack Visualiser (v5.1)</h3>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/" style="height:40px;">
</div>

<div class="panel">

<div id="modeBlock">
<label>Target Total is measured in:</label>
<select id="mode"></select>
</div>

<div id="step1_boards" class="step">
  <div id="boardsWrap">
    <input id="boards" type="number" placeholder="Quantity of Boards Required" />
  </div>
  <div id="linearWrap">
    <input id="metres" type="number" placeholder="Number of Linear Metres Required" />
    <select id="boardLength"></select>
  </div>
</div>

<div id="step2_perRow" class="step hidden">
  <select id="step2Select"></select>
</div>

<div id="step3_yield" class="step hidden">
  <label>Yield (when bandsawing)</label>
  <select id="yield"></select>
</div>

<div id="step4_loose" class="step hidden">
  <select id="topLoose"></select>
</div>

<div id="step5_rejects" class="step hidden">
  <select id="rejects"></select>
  <button onclick="prevStep()">Back</button>
  <button onclick="resetAll()">Reset</button>
</div>

<div class="btnRow">
<button id="nextBtn" onclick="nextStep()">Next</button>
<button id="backBtn" onclick="prevStep()">Back</button>
<button onclick="resetAll()">Reset</button>
</div>

</div>

<div id="summary"></div>
<div id="grid" class="grid"></div>

<script>
let step = 1;

const modeSel = document.getElementById('mode');
const step2Sel = document.getElementById('step2Select');

['Boards','Linear'].forEach(v=>{
  const o=document.createElement('option');
  o.value=v.toLowerCase();
  o.textContent=v;
  modeSel.appendChild(o);
});

function buildStep2(){
  step2Sel.innerHTML='';
  const isLinear = modeSel.value === 'linear';

  const ph=document.createElement('option');
  ph.value='';
  ph.disabled=true;
  ph.selected=true;

  if(isLinear){
    ph.textContent='Select Board Length';
    step2Sel.appendChild(ph);
    [2.4,2.7,3,3.6,4.2].forEach(v=>{
      const o=document.createElement('option');
      o.value=v;
      o.textContent=v;
      step2Sel.appendChild(o);
    });
  } else {
    ph.textContent='How many boards per row?';
    step2Sel.appendChild(ph);
    for(let i=1;i<=15;i++){
      const o=document.createElement('option');
      o.value=i;
      o.textContent=i;
      step2Sel.appendChild(o);
    }
  }
}

function canProceed(){
  if(step===1){
    return modeSel.value==='boards'
      ? document.getElementById('boards').value>0
      : document.getElementById('metres').value>0;
  }
  if(step===2) return step2Sel.value !== '';
  return true;
}

function updateUI(){
  const inStep5 = step === 5;

  document.getElementById('boardsWrap')
    .classList.toggle('hidden', modeSel.value !== 'boards');

  document.getElementById('linearWrap')
    .classList.toggle('hidden', modeSel.value !== 'linear');

  document.querySelectorAll('.step').forEach((el,i)=>
    el.classList.toggle('hidden', i !== step-1)
  );

  document.getElementById('step1_boards')
    .classList.toggle('hidden', step !== 1);

  document.getElementById('headerBar').classList.remove('hidden');

  document.getElementById('modeBlock')
    .classList.toggle('hidden', inStep5);

  buildStep2();

  document.getElementById('nextBtn').disabled = !canProceed();
  document.getElementById('nextBtn').classList.toggle('hidden', inStep5);
  document.getElementById('backBtn').classList.toggle('hidden', step <= 1);

  document.querySelector('.btnRow')
    .classList.toggle('hidden', inStep5);
}

function nextStep(){ if(canProceed()) step++; updateUI(); }
function prevStep(){ if(step>1) step--; updateUI(); }

function resetAll(){
  step=1;
  document.querySelectorAll('input').forEach(i=>i.value='');
  updateUI();
}

modeSel.addEventListener('change',()=>{ step=1; updateUI(); });
document.querySelectorAll('input,select').forEach(el=>{
  el.addEventListener('input',updateUI);
});

updateUI();
</script>

</body>
</html>
