<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Board Calculator - Pack Visualiser v4.2</title>

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background: #fff;
  overflow-x: hidden;
}

/* HEADER */
#headerBar {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:12px;
  background:#e8f5e9;
  padding:10px;
  border-radius:8px;
}

/* PANEL */
.panel {
  display:grid;
  gap:10px;
}

/* INPUTS */
input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
  border:1px solid rgba(0,0,0,0.15);
  border-radius:6px;
}

/* STEP WRAPS */
.hidden { display:none !important; }

.step {
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* BUTTONS */
button {
  width:100%;
  max-width:360px;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.15);
  background:#f5f5f5;
  cursor:pointer;
}

.btnRow {
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* STEP 5 FIXED BAR */
#step5 {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid rgba(0,0,0,0.15);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:999;
}

/* GRID */
.grid {
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row {
  display:flex;
  gap:4px;
  align-items:stretch;
}

.cell, .empty {
  flex:1;
  aspect-ratio:3/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.cell {
  background:#8b5a2b;
  color:#fff;
  border-radius:3px;
}

.empty {
  border:1px dashed #ccc;
}

.reject { background:#f4a300 !important; }

.rowNum {
  font-size:11px;
  color:#666;
  padding-left:6px;
}
</style>
</head>

<body>

<!-- HEADER (always visible) -->
<div id="headerBar">
  <div>
    <h3 style="margin:0;">Pack Visualiser v4.3</h3>
  </div>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
       style="height:40px;">
</div>

<div class="panel">

  <!-- STEP 1 -->
  <div id="step1" class="step">
    <label>Target Mode</label>
    <select id="mode">
      <option value="boards">Boards</option>
      <option value="linear">Linear</option>
    </select>

    <div id="boardsWrap">
      <input id="boards" type="number" placeholder="Quantity of Boards"/>
    </div>

    <div id="linearWrap" class="hidden">
      <input id="metres" type="number" placeholder="Linear Metres"/>
      <select id="boardLength"></select>
    </div>

    <button onclick="nextStep()">Next</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step hidden">
    <label>Boards per Row</label>
    <select id="perRow"></select>
    <button onclick="nextStep()">Next</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="step hidden">
    <label>Yield</label>
    <select id="yield"></select>
    <button onclick="nextStep()">Next</button>
  </div>

  <!-- STEP 4 -->
  <div id="step4" class="step hidden">
    <label>Loose Boards</label>
    <select id="loose"></select>
    <button onclick="nextStep()">Next</button>
  </div>

</div>

<!-- STEP 5 FIXED -->
<div id="step5" class="hidden">
  <label>Rejects</label>
  <select id="rejects"></select>

  <div style="display:flex; gap:8px;">
    <button onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>
</div>

<!-- OUTPUT -->
<div id="summary" style="margin-top:10px;"></div>
<div class="grid" id="grid"></div>

<script>
let step = 1;

const mode = document.getElementById('mode');
const boards = document.getElementById('boards');
const metres = document.getElementById('metres');
const boardLength = document.getElementById('boardLength');
const perRow = document.getElementById('perRow');
const yieldSel = document.getElementById('yield');
const loose = document.getElementById('loose');
const rejects = document.getElementById('rejects');

for(let i=1;i<=15;i++){
  perRow.innerHTML += `<option>${i}</option>`;
}

for(let i=1;i<=6;i++){
  yieldSel.innerHTML += `<option>${i}</option>`;
}

for(let i=0;i<=30;i++){
  loose.innerHTML += `<option>${i}</option>`;
  rejects.innerHTML += `<option>${i}</option>`;
}

function state(){
  return {
    mode: mode.value,
    boards: +boards.value || 0,
    metres: +metres.value || 0,
    perRow: +perRow.value || 0,
    yield: +yieldSel.value || 1,
    loose: +loose.value || 0,
    rejects: +rejects.value || 0,
    boardLength: +boardLength.value || 0
  };
}

function base(){
  const s = state();
  return s.mode === 'linear'
    ? Math.ceil(s.metres / (s.boardLength || 1))
    : s.boards;
}

function render(){
  const s = state();
  const baseVal = base();
  const total = baseVal + s.rejects;

  document.getElementById('summary').innerText =
    `Base ${baseVal} | Rejects ${s.rejects} | Total ${total}`;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
}

function show(){
  document.querySelectorAll('.step').forEach((el,i)=>{
    el.classList.toggle('hidden', i !== step-1);
  });

  document.getElementById('step5').classList.toggle('hidden', step !== 5);
}

function nextStep(){
  if(step < 5) step++;
  show();
  render();
}

function prevStep(){
  if(step > 1) step--;
  show();
  render();
}

function resetAll(){
  step = 1;
  boards.value = '';
  metres.value = '';
  perRow.value = '';
  loose.value = '';
  rejects.value = '';
  boardLength.value = '';
  show();
  render();
}

mode.addEventListener('change', ()=>{
  step = 1;
  show();
  render();
});

show();
render();
</script>

</body>
</html>
