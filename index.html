<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board Calculator</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4caf50">

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
}

.panel {
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-bottom:10px;
}

select {
  appearance: none;
  -webkit-appearance: none;
  color: #000;
  background-color: #fff;
  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 6px;
}

input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
}

#linearWrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.hidden { display:none !important; }

button {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  max-width: 360px;
  padding: 12px 14px;
  font-size: 16px;
  font-weight: 500;
  border-radius: 10px;
  border: 1px solid rgba(0,0,0,0.15);
  background: #f5f5f5;
  color: #333;
  margin-top: 6px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
  -webkit-tap-highlight-color: transparent;
}

.btnRow {
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:6px;
}

/* KEEP your width overrides */
#metres { max-width: 100%; }
#boardLength { max-width: 100%; }

/* NEW: compact step 5 */
.compactBar {
  display:flex;
  gap:8px;
  align-items:center;
}

.compactBar input {
  flex:1;
  max-width:120px;
}

.compactBar button {
  flex:0 0 auto;
  max-width:100px;
  margin-top:0;
}

.grid {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
  width:100%;
  max-width:100vw;
}

.row {
  display:flex;
  gap:4px;
  align-items:stretch;
  width:100%;
}

.row.loose {
  margin-bottom:12px;
}

.cell, .empty {
  flex: 1 1 0;
  min-width: 0;
  aspect-ratio: 3/1;
  box-sizing: border-box;
}

.cell {
  border: 1px solid rgba(0,0,0,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  border-radius:3px;
  background:#8b5a2b;
  color:#fff;
}

.empty {
  border: 1px dashed rgba(0,0,0,0.1);
}

.reject { background:#f4a300 !important; }
.loose .cell { background:#a06a3a; }

.ghost .cell {
  opacity: 0.12;
  background: rgba(139, 90, 43, 0.15);
}

.rowNum {
  font-size:11px;
  color:#666;
  padding-left:8px;
  min-width:20px;
  flex:0 0 auto;
}
</style>
</head>

<body>

<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px;">
  <div style="display:flex; flex-direction:column; gap:6px;">
    <h3 style="margin:0; line-height:1.2;">
      Pack Visualiser (v3.34)
    </h3>
  </div>

  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
       alt="Logo"
       style="height:40px; width:auto; object-fit:contain;" />
</div>

<div class="panel">

  <label>Target Total is measured in:</label>
  <select id="mode"></select>

  <div id="step1_boards" class="step">
    <div id="boardsWrap">
      <input id="boards" type="number" placeholder="Quantity of Boards Required" />
    </div>

    <div id="linearWrap">
      <input id="metres" type="number" placeholder="Number of Linear Metres Required" />
      <select id="boardLength"></select>
    </div>
  </div>

  <div id="step2_perRow" class="step hidden">
    <select id="perRow"></select>
  </div>

  <div id="step3_yield" class="step hidden yieldField">
    <label for="yield">Board Yield (use when bandsawing)</label>
    <select id="yield"></select>
  </div>

  <div id="step4_loose" class="step hidden">
    <select id="topLoose"></select>
  </div>

  <!-- UPDATED STEP 5 -->
  <div id="step5_rejects" class="step hidden compactBar">
    <input id="rejects" type="number" placeholder="How many Rejects?" />
    <button onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <div class="btnRow">
    <button id="nextBtn" onclick="nextStep()">Next</button>
    <button id="backBtn" onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>

</div>

<div id="summary" style="font-size:13px;margin-top:8px;color:#333;"></div>
<div class="grid" id="grid"></div>

<script>
// ONLY change: hide button row on step 5

function updateUI(){
  document.getElementById('boardsWrap').classList.toggle('hidden',modeSel.value!=='boards');
  document.getElementById('linearWrap').classList.toggle('hidden',modeSel.value!=='linear');

  document.querySelectorAll('.step').forEach((el,i)=>
    el.classList.toggle('hidden',i!==step-1)
  );

  document.getElementById('nextBtn').disabled=!canProceed();
  document.getElementById('nextBtn').classList.toggle('hidden',step>=5);
  document.getElementById('backBtn').classList.toggle('hidden',step<=1);

  // NEW LINE ONLY
  document.querySelector('.btnRow').classList.toggle('hidden', step === 5);

  updateLooseOptions();
}
</script>

</body>
</html>
