<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pack Visualiser v4.2</title>

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
  padding-bottom: 120px;
}

/* ================= HEADER (RESTORED GREEN BAR FEEL) ================= */
#headerBar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  padding:10px 12px;
  background:#e8f5e9; /* light green restored */
  border:1px solid #c8e6c9;
  border-radius:10px;
}

#headerBar h3 {
  margin:0;
}

/* ================= LAYOUT ================= */
.hidden { display:none !important; }

.panel {
  display:grid;
  gap:10px;
}

/* INPUTS */
input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
  border:1px solid rgba(0,0,0,0.15);
  border-radius:6px;
}

/* STEP SYSTEM */
.step { display:none; }
.step.active { display:block; }

/* STEP 1 spacing FIX */
#step1 > div {
  margin-bottom:10px;
}

/* BUTTONS */
button {
  width:100%;
  max-width:360px;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.15);
  background:#f5f5f5;
  cursor:pointer;
}

/* REMOVE BACK BUTTON COMPLEXITY */
#step1 button {
  margin-top:8px;
}

/* NAV (only reset now) */
.btnRow {
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:10px;
}

/* ================= STEP 5 ================= */
#step5 {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid rgba(0,0,0,0.15);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:1000;
}

/* ================= GRID ================= */
.grid {
  margin-top:14px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row {
  display:flex;
  gap:4px;
}

.cell, .empty {
  flex:1;
  aspect-ratio:3/1;
  border-radius:3px;
}

.cell {
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  background:#8b5a2b;
  color:#fff;
}

.empty {
  border:1px dashed rgba(0,0,0,0.2);
}

.reject { background:#f4a300 !important; }

.rowNum {
  font-size:11px;
  color:#666;
  padding-left:6px;
}

/* ================= SUMMARY (FIXED SPACING) ================= */
#summary {
  margin-top:12px;
  font-size:13px;
  color:#333;
}
</style>
</head>

<body>

<!-- HEADER (RESTORED VISUAL EMPHASIS) -->
<div id="headerBar">
  <h3>Pack Visualiser v4.3</h3>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
       style="height:40px;">
</div>

<div class="panel">

  <div id="modeBlock">
    <label>Target Total is measured in:</label>
    <select id="mode"></select>
  </div>

  <!-- STEP 1 -->
  <div id="step1" class="step active">

    <div id="boardsWrap">
      <input id="boards" type="number" placeholder="Quantity of Boards Required">
    </div>

    <div id="linearWrap">
      <input id="metres" type="number" placeholder="Number of Linear Metres Required">
      <select id="boardLength"></select>
    </div>

    <button onclick="nextStep()">Next</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step">
    <select id="perRow"></select>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="step">
    <label>Yield (when bandsawing)</label>
    <select id="yield"></select>
  </div>

  <!-- STEP 4 -->
  <div id="step4" class="step">
    <select id="topLoose"></select>
  </div>

</div>

<!-- STEP 5 -->
<div id="step5" class="hidden">
  <select id="rejects"></select>

  <button onclick="resetAll()">Reset</button>
</div>

<!-- SUMMARY -->
<div id="summary">Base 0 | Rejects 0 | Total 0</div>

<div class="grid" id="grid"></div>

<script>
let step = 1;

/* INIT */
const modeSel = document.getElementById('mode');
const boards = document.getElementById('boards');
const metres = document.getElementById('metres');
const boardLength = document.getElementById('boardLength');

['Boards','Linear'].forEach(v=>{
  const o=document.createElement('option');
  o.value=v.toLowerCase();
  o.textContent=v;
  modeSel.appendChild(o);
});
modeSel.value='boards';

[2.4,2.7,3,3.3,3.6,3.9,4.2,4.5,4.8,5.1,5.4,5.7,6].forEach(v=>{
  const o=document.createElement('option');
  o.value=v;
  o.textContent=v;
  boardLength.appendChild(o);
});

/* STATE */
function state(){
  return {
    mode: modeSel.value,
    boards: +boards.value||0,
    metres: +metres.value||0,
    boardLength: +boardLength.value||0
  };
}

function basePieces(s){
  return s.mode==='linear'
    ? Math.ceil(s.metres/s.boardLength||0)
    : s.boards;
}

/* FLOW */
function nextStep(){ step++; updateUI(); render(); }

function resetAll(){
  step=1;
  boards.value='';
  metres.value='';
  boardLength.value='';
  updateUI();
  render();
}

/* UI */
function updateUI(){
  document.getElementById('step1').classList.toggle('active',step===1);
  document.getElementById('step2').classList.toggle('active',step===2);
  document.getElementById('step3').classList.toggle('active',step===3);
  document.getElementById('step4').classList.toggle('active',step===4);
  document.getElementById('step5').classList.toggle('hidden',step!==5);

  const boardsWrap=document.getElementById('boardsWrap');
  const linearWrap=document.getElementById('linearWrap');

  if(step===1){
    boardsWrap.classList.toggle('hidden',modeSel.value!=='boards');
    linearWrap.classList.toggle('hidden',modeSel.value!=='linear');
  } else {
    boardsWrap.classList.add('hidden');
    linearWrap.classList.add('hidden');
  }
}

/* RENDER */
function render(){
  const s=state();
  const base=basePieces(s);

  document.getElementById('summary').innerText =
    `Base ${base} | Rejects 0 | Total ${base}`;

  document.getElementById('grid').innerHTML='';
}

modeSel.onchange=()=>{step=1;updateUI();render();};
document.querySelectorAll('input,select')
  .forEach(x=>x.oninput=()=>{updateUI();render();});

updateUI(); render();
</script>

</body>
</html>
