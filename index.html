<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pack Visualiser v4.2</title>

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
  padding-bottom: 120px;
}

.hidden { display:none !important; }

/* HEADER */
#headerBar {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:12px;
}

/* PANEL */
.panel {
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

/* INPUTS */
input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
  border:1px solid rgba(0,0,0,0.15);
  border-radius:6px;
  background:#fff;
}

/* STEP WRAPPERS */
.step { display:none; }
.step.active { display:block; }

/* STEP 1 MODE BLOCK */
#modeBlock {
  display:block;
}

/* BUTTONS */
button {
  width:100%;
  max-width:360px;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.15);
  background:#f5f5f5;
  cursor:pointer;
}

/* STEP NAV BUTTONS (top level) */
.btnRow {
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* STEP 5 FIXED BAR */
#step5 {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid rgba(0,0,0,0.15);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:1000;
}

.step5Buttons {
  display:flex;
  gap:8px;
}

.step5Buttons button {
  flex:1;
}

/* GRID */
.grid {
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row {
  display:flex;
  gap:4px;
}

.cell, .empty {
  flex:1;
  aspect-ratio:3/1;
  border-radius:3px;
}

.cell {
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  background:#8b5a2b;
  color:#fff;
}

.empty {
  border:1px dashed rgba(0,0,0,0.2);
}

.reject { background:#f4a300 !important; }

.rowNum {
  font-size:11px;
  color:#666;
  padding-left:6px;
}
</style>
</head>

<body>

<!-- HEADER (always visible) -->
<div id="headerBar">
  <h3 style="margin:0;">Pack Visualiser v4.2</h3>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
       style="height:40px;">
</div>

<div class="panel">

  <!-- MODE -->
  <div id="modeBlock">
    <label>Target Total is measured in:</label>
    <select id="mode"></select>
  </div>

  <!-- STEP 1 -->
  <div id="step1" class="step active">
    <div id="boardsWrap">
      <input id="boards" type="number" placeholder="Quantity of Boards Required" />
    </div>

    <div id="linearWrap">
      <input id="metres" type="number" placeholder="Number of Linear Metres Required" />
      <select id="boardLength"></select>
    </div>

    <button id="nextBtn" onclick="nextStep()">Next</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step">
    <select id="perRow"></select>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="step">
    <label>Yield (when bandsawing)</label>
    <select id="yield"></select>
  </div>

  <!-- STEP 4 -->
  <div id="step4" class="step">
    <select id="topLoose"></select>
  </div>

</div>

<!-- STEP 5 FIXED BAR -->
<div id="step5" class="hidden">
  <select id="rejects"></select>

  <div class="step5Buttons">
    <button onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>
</div>

<!-- NAV (hidden in step 5) -->
<div class="btnRow" id="navRow">
  <button onclick="prevStep()">Back</button>
  <button onclick="resetAll()">Reset</button>
</div>

<div id="summary"></div>
<div class="grid" id="grid"></div>

<script>
let step = 1;

/* ---------- INIT ---------- */
const modeSel = document.getElementById('mode');
const boards = document.getElementById('boards');
const metres = document.getElementById('metres');
const boardLength = document.getElementById('boardLength');
const perRow = document.getElementById('perRow');
const yieldSel = document.getElementById('yield');
const looseSel = document.getElementById('topLoose');
const rejectsSel = document.getElementById('rejects');

['Boards','Linear'].forEach(v=>{
  const o=document.createElement('option');
  o.value=v.toLowerCase();
  o.textContent=v;
  modeSel.appendChild(o);
});
modeSel.value='boards';

[2.4,2.7,3,3.3,3.6,3.9,4.2,4.5,4.8,5.1,5.4,5.7,6].forEach(v=>{
  const o=document.createElement('option');
  o.value=v;
  o.textContent=v;
  boardLength.appendChild(o);
});

for(let i=1;i<=6;i++){
  const o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  yieldSel.appendChild(o);
}
yieldSel.value=1;

for(let i=1;i<=15;i++){
  const o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  perRow.appendChild(o);
}

for(let i=0;i<=30;i++){
  const o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  rejectsSel.appendChild(o);
}

/* ---------- STATE ---------- */
function state(){
  return {
    mode: modeSel.value,
    boards: +boards.value || 0,
    metres: +metres.value || 0,
    boardLength: +boardLength.value || 0,
    perRow: +perRow.value || 0,
    yield: +yieldSel.value || 1,
    topLoose: looseSel.value===''?null:+looseSel.value,
    rejects: +rejectsSel.value || 0
  };
}

function basePieces(s){
  return s.mode==='linear'
    ? Math.ceil(s.metres/s.boardLength||0)
    : s.boards;
}

/* ---------- FLOW ---------- */
function nextStep(){ if(step<5) step++; updateUI(); render(); }
function prevStep(){ if(step>1) step--; updateUI(); render(); }

function resetAll(){
  step=1;
  boards.value='';
  metres.value='';
  boardLength.value='';
  perRow.value='';
  looseSel.value='';
  rejectsSel.value='';
  modeSel.value='boards';
  yieldSel.value=1;
  updateUI(); render();
}

/* ---------- UI ---------- */
function updateUI(){

  document.getElementById('step1').classList.toggle('active',step===1);
  document.getElementById('step2').classList.toggle('active',step===2);
  document.getElementById('step3').classList.toggle('active',step===3);
  document.getElementById('step4').classList.toggle('active',step===4);

  document.getElementById('step5').classList.toggle('hidden',step!==5);
  document.getElementById('navRow').classList.toggle('hidden',step===5);

  document.getElementById('modeBlock').classList.toggle('hidden',step===5);
}

/* ---------- RENDER ---------- */
function render(){
  const s = state();
  const base = basePieces(s);

  const total = base + s.rejects;

  const grid = document.getElementById('grid');
  grid.innerHTML='';

  document.getElementById('summary').innerText =
    `Base: ${base} | Rejects: ${s.rejects} | Total: ${total}`;
}

modeSel.onchange=()=>{step=1;updateUI();render();};
document.querySelectorAll('input,select').forEach(x=>x.oninput=()=>{updateUI();render();});

updateUI(); render();
</script>

</body>
</html>
