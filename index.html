<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board Calculator</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4caf50">

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
}

.panel {
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-bottom:10px;
}

input, select {
  width:100%;
  padding:10px;
  font-size:16px;
}

.hidden { display:none !important; }

button {
  padding:14px;
  width:100%;
  margin-top:8px;
  font-size:16px;
}

.btnRow {
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:6px;
}

.grid {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
  width:100%;
  max-width:100vw;
}

.row {
  display:flex;
  gap:4px;
  align-items:stretch;
  width:100%;
}

.row.loose {
  margin-bottom:12px;
}

.cell, .empty {
  flex: 1 1 0;
  min-width: 0;
  aspect-ratio: 3/1;
  box-sizing: border-box;
}

.cell {
  border: 1px solid rgba(0,0,0,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  border-radius:3px;
  background:#8b5a2b;
  color:#fff;
}

.empty {
  border: 1px dashed rgba(0,0,0,0.1);
}

.reject { background:#f4a300 !important; }
.loose .cell { background:#a06a3a; }

.ghost .cell {
  opacity: 0.12;
  background: rgba(139, 90, 43, 0.15);
}

.rowNum {
  font-size:11px;
  color:#666;
  padding-left:8px;
  min-width:20px;
  flex:0 0 auto;
}
</style>
</head>

<body>

<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px;">

  <div style="display:flex; flex-direction:column; gap:6px;">
    <h3 style="margin:0; line-height:1.2;">
      The Moulder Master Visualiser (v3.2)
    </h3>
  </div>

  <img
    src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
    alt="Logo"
    style="height:28px; width:auto; object-fit:contain;"
  />

</div>

<div class="panel">

  <label>I am measuring:</label>
  <select id="mode"></select>

  <div id="step1_boards" class="step">

    <div id="boardsWrap">
      <input id="boards" type="number" placeholder="Quantity of Boards Required" />
    </div>

    <div id="linearWrap">
      <input id="metres" type="number" placeholder="Number of Linear Metres Required" />
      <select id="boardLength"></select>
    </div>

  </div>

  <div id="step2_perRow" class="step hidden">
    <select id="perRow"></select>
  </div>

  <div id="step3_yield" class="step hidden">
    <label>Yield (when bandsawing)</label>
    <select id="yield"></select>
  </div>

  <div id="step4_loose" class="step hidden">
    <select id="topLoose"></select>
  </div>

  <div id="step5_rejects" class="step hidden">
    <label>Rejects</label>
    <input id="rejects" type="number" />
  </div>

  <div class="btnRow">
    <button id="nextBtn" onclick="nextStep()">Next</button>
    <button id="backBtn" onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>

</div>

<div id="summary" style="font-size:13px;margin-top:8px;color:#333;"></div>
<div class="grid" id="grid"></div>

<script>
let step=1;

const BOARD_LENGTHS=["Select Board Length",2.4,2.7,3,3.3,3.6,3.7,3.9,4.2,4.5,4.8,4.9,5.1,5.4,5.7,6];

const modeSel=document.getElementById('mode');

['Boards','Linear'].forEach(v=>{
  const o=document.createElement('option');
  o.value=v.toLowerCase();
  o.textContent=v;
  modeSel.appendChild(o);
});

modeSel.value='boards';

const bl=document.getElementById('boardLength');

BOARD_LENGTHS.forEach(v=>{
  const o=document.createElement('option');
  o.value=v==='Select Board Length'?"":v;
  o.textContent=v;
  bl.appendChild(o);
});

bl.value="";

const yieldSel=document.getElementById('yield');

for(let i=1;i<=6;i++){
  const o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  yieldSel.appendChild(o);
}

yieldSel.value=1;

const perRowSel=document.getElementById('perRow');

function buildPerRow(){
  perRowSel.innerHTML='';
  const ph=document.createElement('option');
  ph.value='';
  ph.textContent='How many boards per row?';
  ph.disabled=true;
  ph.selected=true;
  perRowSel.appendChild(ph);

  for(let i=1;i<=15;i++){
    const o=document.createElement('option');
    o.value=i;
    o.textContent=i;
    perRowSel.appendChild(o);
  }
}

buildPerRow();

const looseSel=document.getElementById('topLoose');

function state(){
  const looseRaw=looseSel.value;

  return {
    mode:modeSel.value,
    boards:+document.getElementById('boards').value||0,
    metres:+document.getElementById('metres').value||0,
    boardLength:+document.getElementById('boardLength').value||0,
    perRow:+perRowSel.value||0,
    yield:+document.getElementById('yield').value||1,
    topLoose:looseRaw===''?null:parseInt(looseRaw),
    rejects:+document.getElementById('rejects').value||0
  };
}

function basePieces(s){
  if(s.mode==='linear'){
    if(!s.metres||!s.boardLength) return 0;
    return Math.ceil(s.metres/s.boardLength);
  }
  return s.boards;
}

function isReadyToRender(s){
  const base=basePieces(s);
  return base>0 && s.perRow>0 && s.topLoose!==null;
}

function canProceed(){
  const s=state();

  if(step===1){
    return s.mode==='boards'
      ? s.boards>0
      : (s.metres>0 && s.boardLength>0);
  }

  if(step===2) return s.perRow>0;

  if(step===4) return s.topLoose!==null;

  return true;
}

function calcRows(s,base){
  const total=base+s.rejects;
  return Math.ceil(total/s.yield);
}

function updateLooseOptions(){
  const s=state();
  const base=basePieces(s);

  if(!base||!s.perRow) return;

  const max=Math.max(0, s.perRow - 1);
  const sel=looseSel;
  const prev=parseInt(sel.value);

  sel.innerHTML='';

  const ph=document.createElement('option');
  ph.value='';
  ph.textContent='How many loose boards?';
  ph.disabled=true;
  ph.selected=true;
  sel.appendChild(ph);

  for(let i=0;i<=max;i++){
    const o=document.createElement('option');
    o.value=i;
    o.textContent=i;
    sel.appendChild(o);
  }

  if(!Number.isFinite(prev) || prev>max){
    sel.value='';
  } else {
    sel.value=String(prev);
  }
}

function renderGhost(s){
  clearGrid();

  const rows = 10;
  const per = s.perRow;

  const grid = document.getElementById('grid');

  for (let r = 0; r < rows; r++){
    const row = document.createElement('div');
    row.className = 'row ghost';

    for (let c = 0; c < per; c++){
      const d = document.createElement('div');
      d.className = 'empty';
      row.appendChild(d);
    }

    const rn = document.createElement('div');
    rn.className = 'rowNum';
    rn.innerText = r + 1;
    row.appendChild(rn);

    grid.appendChild(row);
  }

  document.getElementById('summary').innerText =
    `Rows: ${rows} | Boards: ${base} | Per Row: ${s.perRow} | Rejects: ${s.rejects}`;
}

function updateUI(){
  document.getElementById('boardsWrap').classList.toggle('hidden',modeSel.value!=='boards');
  document.getElementById('linearWrap').classList.toggle('hidden',modeSel.value!=='linear');

  document.querySelectorAll('.step').forEach((el,i)=>
    el.classList.toggle('hidden',i!==step-1)
  );

  document.getElementById('nextBtn').disabled=!canProceed();
  document.getElementById('nextBtn').classList.toggle('hidden',step>=5);
  document.getElementById('backBtn').classList.toggle('hidden',step<=1);

  updateLooseOptions();
}

function nextStep(){
  if(!canProceed()) return;
  if(step<5) step++;
  updateUI();
  render();
}

function prevStep(){
  if(step>1) step--;
  updateUI();
  render();
}

function clearGrid(){
  document.getElementById('grid').innerHTML='';
  document.getElementById('summary').innerText='';
}

function render(){
  const s=state();

  if(!isReadyToRender(s)){
    if(s.perRow>0){
      renderGhost(s);
    } else {
      clearGrid();
    }
    return;
  }

  clearGrid();

  const base=basePieces(s);
  const total=base+s.rejects;
  const phys=Math.ceil(total/s.yield);
  const basePhys=Math.ceil(base/s.yield);

  let rows=[],rem=phys;

  if(s.topLoose!==null){
    const t=Math.min(s.topLoose,rem);
    rows.push(t);
    rem-=t;
  }

  while(rem>0){
    const c=Math.min(s.perRow,rem);
    rows.push(c);
    rem-=c;
  }

  let count=1;

  rows.forEach((cap,r)=>{
    const row=document.createElement('div');
    row.className='row'+(r===0?' loose':'');

    let cells=[];

    for(let c=0;c<s.perRow;c++){
      const d=document.createElement('div');
      const ok=c<cap&&count<=phys;

      if(ok){
        d.className='cell'+(count>basePhys?' reject':'');
        d.innerText=count++;
      } else {
        d.className='empty';
      }

      cells.push(d);
    }

    cells.reverse();
    cells.forEach(x=>row.appendChild(x));

    const rn=document.createElement('div');
    rn.className='rowNum';
    rn.innerText=r+1;
    row.appendChild(rn);

    document.getElementById('grid').appendChild(row);
  });

  document.getElementById('summary').innerText=
  `Rows: ${rows.length} | Boards: ${total} | Per Row: ${s.perRow} | Rejects: ${s.rejects}`;
}

function resetAll(){
  step=1;

  document.getElementById('boards').value='';
  document.getElementById('metres').value='';
  document.getElementById('perRow').value='';
  looseSel.value='';
  document.getElementById('rejects').value='';
  modeSel.value='boards';
  bl.value='';
  yieldSel.value=1;

  clearGrid();
  updateUI();
}

modeSel.addEventListener('change',()=>{
  step=1;
  updateUI();
  render();
});

document.querySelectorAll('input,select')
  .forEach(el=>el.addEventListener('input',()=>{
    updateUI();
    render();
  }));

updateUI();
render();
</script>

</body>
</html>
