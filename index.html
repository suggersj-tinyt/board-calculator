<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pack Visualiser v4.2.1</title>

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  overflow-x:hidden;
}

/* HEADER ALWAYS VISIBLE */
#headerBar {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:12px;
  background:#e8f5e9;
  padding:10px;
  border-radius:8px;
}

/* INPUT AREA */
.panel {
  display:grid;
  gap:10px;
}

input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
}

/* STEPS */
.step { display:flex; flex-direction:column; gap:10px; }
.hidden { display:none !important; }

/* BUTTONS */
button {
  max-width:360px;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  background:#f5f5f5;
}

/* STEP 5 FULL SCREEN VIEW */
#step5 {
  position:fixed;
  inset:0;
  background:#fff;
  padding:12px;
  display:flex;
  flex-direction:column;
  overflow:auto;
  z-index:999;
}

/* BOTTOM CONTROL BAR */
#bottomBar {
  position:sticky;
  bottom:0;
  display:flex;
  gap:8px;
  padding-top:10px;
  background:#fff;
}

/* GRID */
.grid {
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row { display:flex; gap:4px; }

.cell, .empty {
  flex:1;
  aspect-ratio:3/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.cell { background:#8b5a2b; color:#fff; }
.empty { border:1px dashed #ccc; }

.reject { background:#f4a300 !important; }

.rowNum {
  font-size:11px;
  padding-left:6px;
  color:#666;
}
</style>
</head>

<body>

<div id="headerBar">
  <h3 style="margin:0;">Pack Visualiser v4.5.1</h3>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
       style="height:40px;">
</div>

<div class="panel">

  <!-- STEP 1 -->
  <div id="step1" class="step">
    <label>Measured in</label>
    <select id="mode">
      <option value="boards">Boards</option>
      <option value="linear">Linear</option>
    </select>

    <input id="boards" placeholder="Quantity of Boards"/>
    <div id="linearWrap" class="hidden">
      <input id="metres" placeholder="Linear Metres"/>
      <select id="boardLength"></select>
    </div>

    <button onclick="nextStep()">Next</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step hidden">
    <label>Boards per Row</label>
    <select id="perRow"></select>
    <button onclick="nextStep()">Next</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="step hidden">
    <label>Yield</label>
    <select id="yield"></select>
    <button onclick="nextStep()">Next</button>
  </div>

  <!-- STEP 4 -->
  <div id="step4" class="step hidden">
    <label>Loose Boards</label>
    <select id="loose"></select>
    <button onclick="nextStep()">View Pack</button>
  </div>

</div>

<!-- STEP 5 VISUALISATION -->
<div id="step5" class="hidden">

  <div id="summary"></div>
  <div class="grid" id="grid"></div>

  <div id="bottomBar">
    <button onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>

</div>

<script>
let step = 1;

const mode = document.getElementById('mode');
const boards = document.getElementById('boards');
const metres = document.getElementById('metres');
const boardLength = document.getElementById('boardLength');
const perRow = document.getElementById('perRow');
const yieldSel = document.getElementById('yield');
const loose = document.getElementById('loose');

for(let i=1;i<=15;i++) perRow.innerHTML += `<option>${i}</option>`;
for(let i=1;i<=6;i++) yieldSel.innerHTML += `<option>${i}</option>`;
for(let i=0;i<=30;i++) loose.innerHTML += `<option>${i}</option>`;

function state(){
  return {
    mode:mode.value,
    boards:+boards.value||0,
    metres:+metres.value||0,
    boardLength:+boardLength.value||0,
    perRow:+perRow.value||0,
    yield:+yieldSel.value||1,
    loose:+loose.value||0
  };
}

function basePieces(s){
  return s.mode==='linear'
    ? Math.ceil(s.metres/(s.boardLength||1))
    : s.boards;
}

/* CORE FIX: ALWAYS INCLUDE REJECTS IN FINAL RENDER */
function render(){
  const s = state();

  const base = basePieces(s);
  const total = base + s.loose; // treated as rejects equivalent
  const phys = Math.ceil(total / s.yield);
  const basePhys = Math.ceil(base / s.yield);

  document.getElementById('summary').innerText =
    `Base ${base} | Rejects ${s.loose} | Total ${total}`;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  let count = 1;
  let remaining = phys;
  let rows = [];

  while(remaining>0){
    const cap = Math.min(s.perRow || 1, remaining);
    rows.push(cap);
    remaining -= cap;
  }

  rows.forEach((cap,r)=>{
    const row = document.createElement('div');
    row.className='row';

    let cells=[];
    for(let c=0;c<s.perRow;c++){
      const d=document.createElement('div');

      const ok = c<cap && count<=phys;

      if(ok){
        d.className='cell'+(count>basePhys?' reject':'');
        d.innerText=count++;
      } else d.className='empty';

      cells.push(d);
    }

    cells.reverse().forEach(x=>row.appendChild(x));

    const rn=document.createElement('div');
    rn.className='rowNum';
    rn.innerText=r+1;
    row.appendChild(rn);

    grid.appendChild(row);
  });
}

function show(){
  document.querySelectorAll('.step').forEach((el,i)=>{
    el.classList.toggle('hidden', i!==step-1);
  });

  document.getElementById('step5')
    .classList.toggle('hidden', step!==5);
}

function nextStep(){
  if(step<5) step++;
  show();
  render(); // ALWAYS renders fresh state
}

function prevStep(){
  if(step>1) step--;
  show();
  render();
}

function resetAll(){
  step=1;
  boards.value='';
  metres.value='';
  perRow.value='';
  loose.value='';
  boardLength.value='';
  show();
  render();
}

mode.onchange=()=>{ step=1; show(); render(); };

show();
render();
</script>

</body>
</html>
