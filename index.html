<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board Calculator</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4caf50">

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
  padding-bottom: 110px;
}

.panel {
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-bottom:10px;
}

select {
  appearance: none;
  -webkit-appearance: none;
  color: #000;
  background-color: #fff;
  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 6px;
}

input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
}

#linearWrap {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.hidden { display:none !important; }

button {
  appearance: none;
  -webkit-appearance: none;
  width:100%;
  max-width:360px;
  padding:12px 14px;
  font-size:16px;
  font-weight:500;
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.15);
  background:#f5f5f5;
  color:#333;
  margin-top:6px;
  cursor:pointer;
}

.btnRow {
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:6px;
}

.grid {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
  width:100%;
}

.row {
  display:flex;
  gap:4px;
  width:100%;
}

.cell, .empty {
  flex:1;
  aspect-ratio:3/1;
}

.cell {
  background:#8b5a2b;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.empty {
  border:1px dashed rgba(0,0,0,0.1);
}

.reject { background:#f4a300 !important; }

#step5_rejects {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: #fff;
  border-top: 1px solid rgba(0,0,0,0.12);
  padding: 10px 12px;
  z-index: 1000;
}

.step5Buttons {
  display: flex;
  gap: 8px;
}

.step5Buttons button {
  flex: 1;
}
</style>
</head>

<body>

<div id="headerBar" style="display:flex; justify-content:space-between;">
  <h3>Pack Visualiser (v5.5)</h3>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/" style="height:40px;">
</div>

<div class="panel">

<div id="modeBlock">
<label>Target Total is measured in:</label>
<select id="mode"></select>
</div>

<div id="step1_boards" class="step">
<div id="boardsWrap">
<input id="boards" type="number" placeholder="Quantity of Boards Required">
</div>

<div id="linearWrap">
<input id="metres" type="number" placeholder="Number of Linear Metres Required">
</div>
</div>

<div id="step2_perRow" class="step hidden">

<div id="boardLengthWrap" class="hidden">
<select id="boardLength"></select>
</div>

<div id="perRowWrap" class="hidden">
<select id="perRow"></select>
</div>

</div>

<div id="step3_yield" class="step hidden">
<label>Yield (when bandsawing)</label>
<select id="yield"></select>
</div>

<div id="step4_loose" class="step hidden">
<select id="topLoose"></select>
</div>

<div id="step5_rejects" class="step hidden">
<select id="rejects"></select>
<div class="step5Buttons">
<button onclick="prevStep()">Back</button>
<button onclick="resetAll()">Reset</button>
</div>
</div>

<div class="btnRow">
<button id="nextBtn" onclick="nextStep()">Next</button>
<button id="backBtn" onclick="prevStep()">Back</button>
<button onclick="resetAll()">Reset</button>
</div>

</div>

<div id="summary"></div>
<div id="grid" class="grid"></div>

<script>
let step = 1;

const modeSel = document.getElementById('mode');
const perRowSel = document.getElementById('perRow');
const yieldSel = document.getElementById('yield');

/* mode */
['Boards','Linear'].forEach(v=>{
  const o=document.createElement('option');
  o.value=v.toLowerCase();
  o.textContent=v;
  modeSel.appendChild(o);
});
modeSel.value='boards';

/* ✅ FIX 1: restore placeholder */
function buildPerRow(){
  perRowSel.innerHTML='';

  const ph=document.createElement('option');
  ph.value='';
  ph.textContent='How many boards per row?';
  ph.disabled=true;
  ph.selected=true;
  perRowSel.appendChild(ph);

  for(let i=1;i<=15;i++){
    const o=document.createElement('option');
    o.value=i;
    o.textContent=i;
    perRowSel.appendChild(o);
  }
}
buildPerRow();

/* ✅ FIX 2 + 3: rebuild yield + default */
for(let i=1;i<=6;i++){
  const o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  yieldSel.appendChild(o);
}
yieldSel.value = 1;

function state(){
  return {
    mode: modeSel.value,
    boards: +document.getElementById('boards').value || 0,
    metres: +document.getElementById('metres').value || 0,
    perRow: +perRowSel.value || 0
  };
}

function canProceed(){
  const s=state();
  if(step===1){
    return s.mode==='boards' ? s.boards>0 : s.metres>0;
  }
  if(step===2) return s.perRow>0;
  return true;
}

function updateUI(){

  const s = state();

  document.getElementById('boardsWrap')
    .classList.toggle('hidden', s.mode !== 'boards');

  document.getElementById('linearWrap')
    .classList.toggle('hidden', s.mode !== 'linear');

  document.querySelectorAll('.step').forEach((el,i)=>
    el.classList.toggle('hidden', i !== step-1)
  );

  document.getElementById('step1_boards')
    .classList.toggle('hidden', step !== 1);

  document.getElementById('headerBar')
    .classList.remove('hidden');

  document.getElementById('modeBlock')
    .classList.toggle('hidden', step === 5);

  document.getElementById('nextBtn').disabled=!canProceed();

  if(step === 2){
    document.getElementById('boardLengthWrap')
      .classList.toggle('hidden', s.mode !== 'linear');

    document.getElementById('perRowWrap')
      .classList.remove('hidden');
  }

}

function nextStep(){ if(canProceed()) step++; updateUI(); }
function prevStep(){ if(step>1) step--; updateUI(); }

modeSel.addEventListener('change',()=>{ step=1; updateUI(); });
document.querySelectorAll('input,select')
  .forEach(el=>el.addEventListener('input',updateUI));

updateUI();
</script>

</body>
</html>
