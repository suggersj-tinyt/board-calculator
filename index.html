<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pack Visualiser v4.2</title>

<style>
body {
  font-family: Avenir, "Segoe UI", Arial;
  margin:0;
  background:#fff;
}

/* HEADER */
#headerBar{
  background:#4caf50;
  color:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panel{
  padding:12px;
}

.hidden{display:none !important;}

input, select{
  width:100%;
  max-width:360px;
  padding:12px;
  font-size:16px;
  margin-top:10px;
}

/* buttons */
button{
  width:100%;
  max-width:360px;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}

.btnRow{
  margin-top:10px;
}

/* grid */
.grid{
  padding:10px;
}

.row{
  display:flex;
  gap:4px;
}

.cell{
  flex:1;
  background:#8b5a2b;
  color:#fff;
  text-align:center;
  padding:6px;
  font-size:11px;
}

.reject{background:#f4a300}

.empty{
  flex:1;
  border:1px dashed #ccc;
}

/* step 5 bottom bar */
#step5{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ccc;
  padding:10px;
}

.step5Buttons{
  display:flex;
  gap:8px;
}
.step5Buttons button{
  flex:1;
}
</style>
</head>

<body>

<!-- HEADER -->
<div id="headerBar">
  <h3>Pack Visualiser v4.2</h3>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
       style="height:40px;">
</div>

<div class="panel">

<label>Target Total is measured in:</label>
<select id="mode"></select>

<!-- STEP 1 -->
<div id="step1" class="step">
  <div id="boardsWrap">
    <input id="boards" type="number" inputmode="numeric"
      placeholder="Quantity of Boards Required">
  </div>

  <div id="linearWrap">
    <input id="metres" type="number" inputmode="decimal"
      placeholder="Number of Linear Metres Required">
    <select id="boardLength"></select>
  </div>
</div>

<!-- STEP 2 -->
<div id="step2" class="step hidden">
  <select id="perRow"></select>
</div>

<!-- STEP 3 -->
<div id="step3" class="step hidden">
  <label>Yield (when bandsawing)</label>
  <select id="yield"></select>
</div>

<!-- STEP 4 -->
<div id="step4" class="step hidden">
  <select id="loose"></select>
</div>

<!-- STEP 5 -->
<div id="step5" class="step hidden">
  <select id="rejects"></select>

  <div class="step5Buttons">
    <button onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>
</div>

<div class="btnRow">
  <button id="nextBtn" onclick="nextStep()">Next</button>
</div>

</div>

<div id="summary" style="padding:10px;"></div>
<div id="grid" class="grid"></div>

<script>
let step=1;

const BOARD_LENGTHS=[2.4,2.7,3,3.3,3.6,3.9,4.2,4.5,4.8,5.1,5.4,5.7,6];

const modeSel=document.getElementById('mode');
const boardsWrap=document.getElementById('boardsWrap');
const linearWrap=document.getElementById('linearWrap');

['Boards','Linear'].forEach(v=>{
  let o=document.createElement('option');
  o.value=v.toLowerCase();
  o.textContent=v;
  modeSel.appendChild(o);
});
modeSel.value='boards';

const boardLengthSel=document.getElementById('boardLength');
boardLengthSel.innerHTML='<option value="">Select Board Length</option>';
BOARD_LENGTHS.forEach(v=>{
  let o=document.createElement('option');
  o.value=v;
  o.textContent=v;
  boardLengthSel.appendChild(o);
});

/* per row */
const perRowSel=document.getElementById('perRow');
perRowSel.innerHTML='<option value="">How many boards per row?</option>';
for(let i=1;i<=15;i++){
  let o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  perRowSel.appendChild(o);
}

/* yield */
const yieldSel=document.getElementById('yield');
for(let i=1;i<=6;i++){
  let o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  yieldSel.appendChild(o);
}

/* rejects */
const rejectsSel=document.getElementById('rejects');
rejectsSel.innerHTML='<option value="">How many rejects?</option>';
for(let i=0;i<=30;i++){
  let o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  rejectsSel.appendChild(o);
}

/* loose */
const looseSel=document.getElementById('loose');

function updateLoose(){
  let per=+perRowSel.value||0;
  looseSel.innerHTML='<option value="">How many loose boards on the pack?</option>';
  for(let i=0;i<per;i++){
    let o=document.createElement('option');
    o.value=i;
    o.textContent=i;
    looseSel.appendChild(o);
  }
}

/* STATE */
function state(){
  return{
    mode:modeSel.value,
    boards:+boards.value||0,
    metres:+metres.value||0,
    boardLength:+boardLengthSel.value||0,
    perRow:+perRowSel.value||0,
    yield:+yieldSel.value||1,
    loose:looseSel.value===''?null:+looseSel.value,
    rejects:+rejectsSel.value||0
  }
}

/* BASE CALC */
function basePieces(s){
  if(s.mode==='linear'){
    if(!s.metres||!s.boardLength) return 0;
    return Math.ceil(s.metres/s.boardLength);
  }
  return s.boards;
}

/* NAV */
function nextStep(){
  if(step<5) step++;
  updateUI();
}

function prevStep(){
  if(step>1) step--;
  updateUI();
}

/* UI */
function updateUI(){
  // mode toggle
  boardsWrap.classList.toggle('hidden',modeSel.value!=='boards');
  linearWrap.classList.toggle('hidden',modeSel.value!=='linear');

  // step control
  document.querySelectorAll('.step').forEach((el,i)=>{
    el.classList.toggle('hidden',i!==step-1);
  });

  document.getElementById('nextBtn').style.display = step===5?'none':'block';

  if(step===4) updateLoose();
  if(step===5) render();
}

/* RENDER */
function render(){
  let s=state();

  let base=basePieces(s);
  let total=base+s.rejects;

  let rows=Math.ceil(total/s.perRow||1);

  let grid=document.getElementById('grid');
  grid.innerHTML='';

  let count=1;

  for(let r=0;r<rows;r++){
    let row=document.createElement('div');
    row.className='row';

    let cap = (r===0 && s.loose!==null)? s.loose : s.perRow;

    for(let c=0;c<s.perRow;c++){
      let d=document.createElement('div');

      if(c<cap && count<=total){
        d.className='cell'+(count>base?' reject':'');
        d.innerText=count++;
      }else{
        d.className='empty';
      }

      row.appendChild(d);
    }

    grid.appendChild(row);
  }

  summary.innerText =
  `Rows: ${rows} | Base Boards: ${base} | Per Row: ${s.perRow} | Rejects: ${s.rejects} | Total Boards: ${total}`;
}

/* RESET */
function resetAll(){
  step=1;
  boards.value='';
  metres.value='';
  perRowSel.value='';
  yieldSel.value=1;
  looseSel.value='';
  rejectsSel.value='';
  grid.innerHTML='';
  summary.innerText='';
  updateUI();
}

modeSel.addEventListener('change',()=>{step=1;updateUI();});

updateUI();
</script>

</body>
</html>
