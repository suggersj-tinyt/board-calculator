<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board Calculator</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4caf50">

<style>
  body {
    font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 12px;
    background:#fff;
    overflow-x:hidden;
  }

  .header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }

  /* CENTRED FORM COLUMN */
  .panel {
    max-width:420px;
    margin:0 auto 10px auto;
    display:grid;
    gap:8px;
  }

  .panel input,
  .panel select {
    width:100%;
    max-width:260px;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
  }

  #boardsWrap {
    display:flex;
    justify-content:flex-start;
  }

  .hidden { display:none !important; }

  /* BUTTONS */
  .btnRow {
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-top:6px;
  }

  button {
    padding:9px 12px;
    width:100%;
    max-width:260px;
    margin:0 auto;
    font-size:16px;
    line-height:1.15;

    border-radius:6px;
    border:1px solid rgba(0,0,0,0.15);

    -webkit-appearance:none;
    appearance:none;
  }

  button:active { transform:scale(0.99); }

  /* GRID FULL WIDTH */
  .grid {
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:12px;
    width:100%;
  }

  .row {
    display:flex;
    gap:4px;
    width:100%;
  }

  .row.loose { margin-bottom:12px; }

  .cell, .empty {
    flex:1;
    aspect-ratio:3/1;
    min-width:0;
  }

  .cell {
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    border:1px solid rgba(0,0,0,0.15);
    border-radius:3px;
    background:#8b5a2b;
    color:#fff;
  }

  .empty {
    border:1px dashed rgba(0,0,0,0.1);
  }

  .reject { background:#f4a300 !important; }

  .rowNum {
    font-size:11px;
    color:#666;
    padding-left:8px;
  }
</style>
</head>

<body>

<div class="header">
  <h3 style="margin:0;">The Moulder Master Visualiser (v3.2)</h3>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
       style="height:28px;width:auto;" />
</div>

<div class="panel">

  <label>I am measuring:</label>
  <select id="mode"></select>

  <div id="step1">

    <div id="boardsWrap">
      <input id="boards" type="number" placeholder="Quantity of Boards Required" />
    </div>

    <div id="linearWrap">
      <input id="metres" type="number" placeholder="Number of Linear Metres Required" />
      <select id="boardLength"></select>
    </div>

  </div>

  <div id="step2">
    <select id="perRow"></select>
  </div>

  <div id="step3">
    <label>Yield (when bandsawing)</label>
    <select id="yield"></select>
  </div>

  <div id="step4">
    <select id="topLoose"></select>
  </div>

  <div id="step5">
    <label>Rejects</label>
    <input id="rejects" type="number" />
  </div>

  <div class="btnRow">
    <button id="nextBtn" onclick="nextStep()">Next</button>
    <button id="backBtn" onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>

</div>

<div id="summary" style="font-size:13px;margin-top:8px;color:#333;"></div>
<div class="grid" id="grid"></div>

<script>
let step = 1;

/* ---------------- STATE ---------------- */

function state(){
  return {
    mode: mode.value,
    boards: +boards.value || 0,
    metres: +metres.value || 0,
    boardLength: +boardLength.value || 0,
    perRow: +perRow.value || 0,
    yield: +yield.value || 1,
    topLoose: topLoose.value === '' ? null : +topLoose.value,
    rejects: +rejects.value || 0
  };
}

/* ---------------- INIT ---------------- */

const mode = document.getElementById('mode');
const boards = document.getElementById('boards');
const metres = document.getElementById('metres');
const boardLength = document.getElementById('boardLength');
const perRow = document.getElementById('perRow');
const yield = document.getElementById('yield');
const topLoose = document.getElementById('topLoose');
const rejects = document.getElementById('rejects');

['Boards','Linear'].forEach(v=>{
  const o=document.createElement('option');
  o.value=v.toLowerCase();
  o.textContent=v;
  mode.appendChild(o);
});
mode.value='boards';

[2.4,2.7,3,3.3,3.6,3.7,3.9,4.2,4.5,4.8,4.9,5.1,5.4,5.7,6].forEach(v=>{
  const o=document.createElement('option');
  o.value=v;
  o.textContent=v;
  boardLength.appendChild(o);
});

for(let i=1;i<=6;i++){
  const o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  yield.appendChild(o);
}

function buildPerRow(){
  perRow.innerHTML='';
  for(let i=1;i<=15;i++){
    const o=document.createElement('option');
    o.value=i;
    o.textContent=i;
    perRow.appendChild(o);
  }
}
buildPerRow();

/* ---------------- LOGIC ---------------- */

function basePieces(s){
  if(s.mode==='linear'){
    if(!s.metres||!s.boardLength) return 0;
    return Math.ceil(s.metres/s.boardLength);
  }
  return s.boards;
}

function canProceed(){
  const s = state();

  if(step===1){
    return s.mode==='boards' ? s.boards>0 : (s.metres>0 && s.boardLength>0);
  }
  if(step===2) return s.perRow>0;
  if(step===4) return s.topLoose!==null;

  return true;
}

/* ---------------- UI SYNC (KEY FIX) ---------------- */

function syncUI(){
  step1.classList.toggle('hidden', step !== 1);
  step2.classList.toggle('hidden', step !== 2);
  step3.classList.toggle('hidden', step !== 3);
  step4.classList.toggle('hidden', step !== 4);
  step5.classList.toggle('hidden', step !== 5);

  nextBtn.disabled = !canProceed();
  nextBtn.classList.toggle('hidden', step >= 5);
  backBtn.classList.toggle('hidden', step <= 1);

  boardsWrap.classList.toggle('hidden', mode.value !== 'boards');
  linearWrap.classList.toggle('hidden', mode.value !== 'linear');

  syncLooseOptions();
}

/* ---------------- SAFE LOOSE OPTIONS ---------------- */

function syncLooseOptions(){
  const s = state();
  const base = basePieces(s);

  if(!s.perRow || !base) return;

  const max = Math.max(0, s.perRow - 1);
  const prev = +topLoose.value;

  topLoose.innerHTML = '';

  const ph = document.createElement('option');
  ph.value='';
  ph.textContent='How many loose boards?';
  ph.selected=true;
  ph.disabled=true;
  topLoose.appendChild(ph);

  for(let i=0;i<=max;i++){
    const o=document.createElement('option');
    o.value=i;
    o.textContent=i;
    topLoose.appendChild(o);
  }

  topLoose.value = (prev<=max ? prev : '');
}

/* ---------------- NAV ---------------- */

function nextStep(){
  if(!canProceed()) return;
  step++;
  syncUI();
  render();
}

function prevStep(){
  step--;
  syncUI();
  render();
}

/* ---------------- RENDER ---------------- */

function clear(){
  grid.innerHTML='';
  summary.innerText='';
}

function render(){
  clear();

  const s = state();
  const base = basePieces(s);
  if(!base || !s.perRow || s.topLoose===null) return;

  const total = base + s.rejects;
  const phys = Math.ceil(total / s.yield);

  let rows=[], rem=phys;

  rows.push(Math.min(s.topLoose, rem));
  rem -= rows[0];

  while(rem>0){
    const c=Math.min(s.perRow,rem);
    rows.push(c);
    rem-=c;
  }

  let count=1;

  rows.forEach((cap,r)=>{
    const row=document.createElement('div');
    row.className='row'+(r===0?' loose':'');

    for(let c=0;c<s.perRow;c++){
      const d=document.createElement('div');
      const ok=c<cap&&count<=phys;
      d.className=ok?'cell':'empty';
      if(ok) d.innerText=count++;
      row.appendChild(d);
    }

    const rn=document.createElement('div');
    rn.className='rowNum';
    rn.innerText=r+1;
    row.appendChild(rn);

    grid.appendChild(row);
  });

  summary.innerText =
    `Rows: ${rows.length} | Boards: ${total} | Per Row: ${s.perRow}`;
}

/* ---------------- EVENTS ---------------- */

document.querySelectorAll('input,select')
  .forEach(el=>el.addEventListener('input',()=>{syncUI();render();}));

mode.addEventListener('change',()=>{step=1;syncUI();render();});

syncUI();
render();
</script>

</body>
</html>
