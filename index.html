<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board Calculator</title>

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
}

.hidden { display:none !important; }

.panel {
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-bottom:10px;
}

input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
}

button {
  width:100%;
  max-width:360px;
  padding:12px;
  margin-top:6px;
}

.btnRow {
  display:flex;
  gap:8px;
}

.step5Buttons {
  display:flex;
  gap:8px;
  margin-top:10px;
}

.step5Buttons button {
  flex:1;
}

.grid {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
}

.row {
  display:flex;
  gap:4px;
}

.cell, .empty {
  flex:1;
  aspect-ratio:3/1;
}

.cell {
  background:#8b5a2b;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.empty {
  border:1px dashed #ddd;
}

.reject { background:#f4a300 !important; }

.rowNum {
  font-size:11px;
  margin-left:6px;
  color:#666;
}
</style>
</head>

<body>

<div id="headerBar" style="display:flex; justify-content:space-between;">
  <h3>Pack Visualiser V4.1</h3>
</div>

<div class="panel">

  <div id="modeBlock">
    <label>Measured in:</label>
    <select id="mode"></select>
  </div>

  <div id="step1">
    <input id="boards" type="number" placeholder="Boards" />
    <input id="metres" type="number" placeholder="Metres" />
    <select id="boardLength"></select>
  </div>

  <div id="step2">
    <select id="perRow"></select>
  </div>

  <div id="step3">
    <select id="yield"></select>
  </div>

  <div id="step4">
    <select id="topLoose"></select>
  </div>

  <div id="step5" class="hidden">
    <select id="rejects"></select>

    <div class="step5Buttons">
      <button onclick="prevStep()">Back</button>
      <button onclick="resetAll()">Reset</button>
    </div>
  </div>

  <div class="btnRow" id="navButtons">
    <button onclick="nextStep()" id="nextBtn">Next</button>
    <button onclick="prevStep()" id="backBtn">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>

</div>

<div id="summary"></div>
<div class="grid" id="grid"></div>

<script>

let step = 1;

const modeSel = document.getElementById('mode');
const perRowSel = document.getElementById('perRow');
const yieldSel = document.getElementById('yield');
const looseSel = document.getElementById('topLoose');
const rejectsSel = document.getElementById('rejects');

modeSel.innerHTML = `
<option value="boards">Boards</option>
<option value="linear">Linear</option>
`;

for(let i=1;i<=15;i++){
  perRowSel.innerHTML += `<option value="${i}">${i}</option>`;
}

for(let i=1;i<=6;i++){
  yieldSel.innerHTML += `<option value="${i}">${i}</option>`;
}

for(let i=0;i<=30;i++){
  rejectsSel.innerHTML += `<option value="${i}">${i}</option>`;
}

function state(){
  return {
    mode: modeSel.value,
    boards: +boards.value || 0,
    metres: +metres.value || 0,
    boardLength: +boardLength.value || 0,
    perRow: +perRowSel.value || 0,
    yield: +yieldSel.value || 1,
    topLoose: looseSel.value === "" ? null : +looseSel.value,
    rejects: +rejectsSel.value || 0
  };
}

function basePieces(s){
  return s.mode === "linear"
    ? Math.ceil(s.metres / s.boardLength || 0)
    : s.boards;
}

function updateUI(){

  step1.classList.toggle('hidden', step !== 1 && step !== 5);
  step2.classList.toggle('hidden', step !== 2 && step !== 5);
  step3.classList.toggle('hidden', step !== 3 && step !== 5);
  step4.classList.toggle('hidden', step !== 4 && step !== 5);
  step5.classList.toggle('hidden', step !== 5);

  modeBlock.classList.toggle('hidden', step === 5);
  navButtons.classList.toggle('hidden', step === 5);

  render();
}

function nextStep(){ if(step < 5) step++; updateUI(); }
function prevStep(){ if(step > 1) step--; updateUI(); }

function resetAll(){
  step = 1;

  boards.value = "";
  metres.value = "";
  boardLength.value = "";
  perRowSel.value = "";
  looseSel.value = "";
  rejectsSel.value = "";

  updateUI();
}

function render(){
  const s = state();
  const base = basePieces(s);

  summary.innerText =
    `Base: ${base} | Per Row: ${s.perRow} | Rejects: ${s.rejects}`;
}

updateUI();

</script>

</body>
</html>
