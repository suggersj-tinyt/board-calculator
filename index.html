<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board Calculator</title>

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
}

.hidden { display:none !important; }

.panel {
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-bottom:10px;
}

select, input {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
}

button {
  width:100%;
  max-width:360px;
  padding:12px;
  margin-top:6px;
}

.btnRow {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.step5Buttons {
  display:flex;
  gap:8px;
  margin-top:10px;
}

.step5Buttons button {
  flex:1;
}

.grid {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
}

.row {
  display:flex;
  gap:4px;
}

.cell, .empty {
  flex:1;
  aspect-ratio:3/1;
}

.cell {
  background:#8b5a2b;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.empty {
  border:1px dashed #ddd;
}

.reject { background:#f4a300 !important; }

.rowNum {
  font-size:11px;
  margin-left:6px;
  color:#666;
}
</style>
</head>

<body>

<!-- HEADER (ALWAYS VISIBLE) -->
<div id="headerBar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
  <h3 style="margin:0;">Pack Visualiser v4.2</h3>

  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/"
       style="height:40px;">
</div>

<div class="panel">

  <!-- MODE -->
  <div id="modeBlock">
    <label>Measured in:</label>
    <select id="mode"></select>
  </div>

  <!-- STEP 1 -->
  <div id="step1_boards" class="step">

    <div id="boardsWrap">
      <input id="boards" type="number" placeholder="Quantity of Boards Required">
    </div>

    <div id="linearWrap">
      <input id="metres" type="number" placeholder="Number of Linear Metres Required">
      <select id="boardLength"></select>
    </div>

  </div>

  <!-- STEP 2 -->
  <div id="step2_perRow" class="step hidden">
    <select id="perRow"></select>
  </div>

  <!-- STEP 3 -->
  <div id="step3_yield" class="step hidden">
    <select id="yield"></select>
  </div>

  <!-- STEP 4 -->
  <div id="step4_loose" class="step hidden">
    <select id="topLoose"></select>
  </div>

  <!-- STEP 5 -->
  <div id="step5_rejects" class="step hidden">
    <select id="rejects"></select>

    <div class="step5Buttons">
      <button onclick="prevStep()">Back</button>
      <button onclick="resetAll()">Reset</button>
    </div>
  </div>

  <!-- NAV -->
  <div class="btnRow">
    <button id="nextBtn" onclick="nextStep()">Next</button>
    <button id="backBtn" onclick="prevStep()">Back</button>
    <button onclick="resetAll()">Reset</button>
  </div>

</div>

<div id="summary"></div>
<div class="grid" id="grid"></div>

<script>

let step = 1;

const modeSel = document.getElementById('mode');
const perRowSel = document.getElementById('perRow');
const yieldSel = document.getElementById('yield');
const looseSel = document.getElementById('topLoose');
const rejectsSel = document.getElementById('rejects');

modeSel.innerHTML = `
<option value="boards">Boards</option>
<option value="linear">Linear</option>
`;

for(let i=1;i<=15;i++){
  perRowSel.innerHTML += `<option value="${i}">${i}</option>`;
}

for(let i=1;i<=6;i++){
  yieldSel.innerHTML += `<option value="${i}">${i}</option>`;
}

for(let i=0;i<=30;i++){
  rejectsSel.innerHTML += `<option value="${i}">${i}</option>`;
}

function state(){
  return {
    mode: modeSel.value,
    boards: +boards.value || 0,
    metres: +metres.value || 0,
    boardLength: +boardLength.value || 0,
    perRow: +perRowSel.value || 0,
    yield: +yieldSel.value || 1,
    topLoose: looseSel.value==="" ? null : +looseSel.value,
    rejects: +rejectsSel.value || 0
  };
}

function basePieces(s){
  return s.mode === "linear"
    ? Math.ceil((s.metres || 0) / (s.boardLength || 1))
    : s.boards;
}

/* ================= UI ================= */

function updateUI(){

  const inStep5 = step === 5;

  // STEP VISIBILITY (explicit, no index bugs)
  step1_boards.classList.toggle('hidden', inStep5 || step !== 1);
  step2_perRow.classList.toggle('hidden', inStep5 || step !== 2);
  step3_yield.classList.toggle('hidden', inStep5 || step !== 3);
  step4_loose.classList.toggle('hidden', inStep5 || step !== 4);
  step5_rejects.classList.toggle('hidden', !inStep5);

  // MODE ONLY IN STEP 1–4
  modeBlock.classList.toggle('hidden', inStep5);

  // STEP 1 INPUT MODE SWITCH (CRITICAL FIX)
  const isBoards = modeSel.value === "boards";
  boardsWrap.classList.toggle('hidden', !isBoards);
  linearWrap.classList.toggle('hidden', isBoards ? true : false);

  // NAV BUTTONS
  nextBtn.classList.toggle('hidden', step >= 5);
  backBtn.classList.toggle('hidden', step <= 1);
  document.querySelector('.btnRow').classList.toggle('hidden', inStep5);

  render();
}

/* ================= NAV ================= */

function nextStep(){ if(step < 5) step++; updateUI(); }
function prevStep(){ if(step > 1) step--; updateUI(); }

function resetAll(){
  step = 1;
  boards.value = "";
  metres.value = "";
  boardLength.value = "";
  perRowSel.value = "";
  looseSel.value = "";
  rejectsSel.value = "";
  updateUI();
}

/* ================= RENDER ================= */

function render(){
  const s = state();
  const base = basePieces(s);

  summary.innerText =
    `Base: ${base} | Per Row: ${s.perRow} | Rejects: ${s.rejects}`;
}

/* ================= INIT ================= */

modeSel.innerHTML = `
<option value="boards">Boards</option>
<option value="linear">Linear</option>
`;

updateUI();

</script>

</body>
</html>
