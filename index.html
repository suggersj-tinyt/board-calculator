<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board Calculator</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4caf50">

<style>
body {
  font-family: Avenir, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  margin: 12px;
  background:#fff;
  overflow-x:hidden;
  padding-bottom:110px;
}

.panel { display:grid; gap:8px; margin-bottom:10px; }

input, select {
  width:100%;
  max-width:360px;
  padding:10px;
  font-size:16px;
}

.hidden { display:none !important; }

button {
  width:100%;
  max-width:360px;
  padding:12px;
  border-radius:10px;
}

.btnRow { display:flex; flex-direction:column; gap:8px; }

.grid { margin-top:12px; }
.row { display:flex; gap:4px; }

.cell {
  flex:1;
  aspect-ratio:3/1;
  background:#8b5a2b;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.empty { flex:1; border:1px dashed #ccc; }

.reject { background:#f4a300; }

#step5_rejects {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:10px;
  border-top:1px solid #ccc;
}

.step5Buttons { display:flex; gap:8px; }
.step5Buttons button { flex:1; }
</style>
</head>

<body>

<div id="headerBar" style="display:flex; justify-content:space-between;">
  <h3>Pack Visualiser (v5.6)</h3>
  <img src="https://static1.squarespace.com/static/5edd6c658f45a62c80cc5bee/t/648b901ba727837ab5445bef/1776199641436/" style="height:40px;">
</div>

<div class="panel">

<div id="modeBlock">
<label>Target Total is measured in:</label>
<select id="mode"></select>
</div>

<!-- STEP 1 -->
<div id="step1" class="step">
<div id="boardsWrap">
<input id="boards" type="number" placeholder="Quantity of Boards Required">
</div>

<div id="linearWrap">
<input id="metres" type="number" placeholder="Number of Linear Metres Required">
</div>
</div>

<!-- STEP 2 -->
<div id="step2" class="step hidden">

<div id="boardLengthWrap" class="hidden">
<select id="boardLength"></select>
</div>

<div>
<select id="perRow"></select>
</div>

</div>

<!-- STEP 3 -->
<div id="step3" class="step hidden">
<label>Yield (when bandsawing)</label>
<select id="yield"></select>
</div>

<!-- STEP 4 -->
<div id="step4" class="step hidden">
<select id="topLoose"></select>
</div>

<!-- STEP 5 -->
<div id="step5_rejects" class="step hidden">
<select id="rejects"></select>

<div class="step5Buttons">
<button onclick="prevStep()">Back</button>
<button onclick="resetAll()">Reset</button>
</div>
</div>

<div class="btnRow">
<button id="nextBtn" onclick="nextStep()">Next</button>
<button id="backBtn" onclick="prevStep()">Back</button>
<button onclick="resetAll()">Reset</button>
</div>

</div>

<div id="summary"></div>
<div id="grid" class="grid"></div>

<script>
let step=1;

const modeSel=document.getElementById('mode');
const perRowSel=document.getElementById('perRow');
const yieldSel=document.getElementById('yield');
const looseSel=document.getElementById('topLoose');
const rejectsSel=document.getElementById('rejects');

/* MODE */
['Boards','Linear'].forEach(v=>{
  let o=document.createElement('option');
  o.value=v.toLowerCase();
  o.textContent=v;
  modeSel.appendChild(o);
});
modeSel.value='boards';

/* BOARD LENGTH */
[2.4,2.7,3,3.3,3.6,4.2,4.8,6].forEach(v=>{
  let o=document.createElement('option');
  o.value=v;
  o.textContent=v;
  document.getElementById('boardLength').appendChild(o);
});

/* PER ROW */
let ph=document.createElement('option');
ph.textContent='How many boards per row?';
ph.disabled=true;
ph.selected=true;
perRowSel.appendChild(ph);

for(let i=1;i<=15;i++){
  let o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  perRowSel.appendChild(o);
}

/* YIELD */
for(let i=1;i<=6;i++){
  let o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  yieldSel.appendChild(o);
}
yieldSel.value=1;

/* LOOSE */
function updateLoose(){
  looseSel.innerHTML='';
  let ph=document.createElement('option');
  ph.textContent='How many loose boards on the pack?';
  ph.disabled=true;
  ph.selected=true;
  looseSel.appendChild(ph);

  let max=+perRowSel.value||0;
  for(let i=0;i<max;i++){
    let o=document.createElement('option');
    o.value=i;
    o.textContent=i;
    looseSel.appendChild(o);
  }
}

/* REJECTS */
for(let i=0;i<=30;i++){
  let o=document.createElement('option');
  o.value=i;
  o.textContent=i;
  rejectsSel.appendChild(o);
}

/* STATE */
function state(){
  return {
    mode:modeSel.value,
    boards:+boards.value||0,
    metres:+metres.value||0,
    perRow:+perRowSel.value||0,
    yield:+yieldSel.value||1,
    loose:+looseSel.value||0,
    rejects:+rejectsSel.value||0
  };
}

/* NAV */
function canProceed(){
  let s=state();
  if(step===1) return s.mode==='boards'?s.boards>0:s.metres>0;
  if(step===2) return s.perRow>0;
  return true;
}

function nextStep(){ if(canProceed()) step++; updateUI(); render(); }
function prevStep(){ if(step>1) step--; updateUI(); render(); }

/* UI */
function updateUI(){

  document.getElementById('boardsWrap')
    .classList.toggle('hidden',modeSel.value!=='boards');

  document.getElementById('linearWrap')
    .classList.toggle('hidden',modeSel.value!=='linear');

  document.querySelectorAll('.step').forEach((el,i)=>{
    el.classList.toggle('hidden',i!==step-1);
  });

  document.getElementById('boardLengthWrap')
    .classList.toggle('hidden',modeSel.value!=='linear');

  document.getElementById('nextBtn').disabled=!canProceed();

  updateLoose();
}

/* RENDER */
function render(){
  const s=state();
  const base=s.mode==='boards'?s.boards:Math.ceil(s.metres/3);
  const total=base+s.rejects;

  document.getElementById('summary').innerText=
    `Base ${base} | Rejects ${s.rejects} | Total ${total}`;
}

/* EVENTS */
modeSel.addEventListener('change',()=>{step=1;updateUI();});
document.querySelectorAll('input,select')
  .forEach(el=>el.addEventListener('input',()=>{updateUI();render();}));

updateUI(); render();
</script>

</body>
</html>
